
# Список микросервисов, на которые будет перенаправлять запросы API Gateway.
microservices:
  oauth2-url: ${OAUTH2_SERVICE_URL:http://oauth2-container:8091}
  currency-url: ${CURRENCIES_SERVICE_URL:http://currencies-container:8092}
  credit-cards-url: ${CREDIT_CARD_SERVICE_URL:http://credit-card-container:8093}
  payments-url: ${PAYMENTS_SERVICE_URL:http://payments-container:8094}
  monitoring-url: ${MONITORING_SERVICE_URL:http://monitoring-container:8095}
  aggregate-url: ${AGGREGATE_SERVICE_URL:http://aggregate-container:8096}

spring:
  application:
    name: oauth2-service
  profiles:
    active: dev

  r2dbc:
    url: r2dbc:postgresql://my-postgres:5432/ms_oauth2
    username: admin
    password: admin

  flyway:
    enabled: true
    url: jdbc:postgresql://my-postgres:5432/ms_oauth2
    user: admin
    password: admin
    locations: classpath:db/migration
    baseline-on-migrate: true

#eureka:
#  client:
#    service-url:
#      defaultZone: http://localhost:8761/eureka/
#    register-with-eureka: true
#    fetch-registry: true

management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: always

server:
  port: 8091

